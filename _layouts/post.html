<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
    <meta name="author" content="{{ page.author | default: site.title }}">

    <title>{{ page.title }} | Jingdi Lei</title>

    <link href="{{ '/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">
    <link href="{{ '/css/agency.css?v=20260508-blog-md' | relative_url }}" rel="stylesheet">
    <link href="{{ '/font-awesome-4.1.0/css/font-awesome.min.css' | relative_url }}" rel="stylesheet" type="text/css">
    <link href="{{ '/css/font-1.css' | relative_url }}" rel="stylesheet" type="text/css">

</head>

<body id="page-top" class="index">

    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container">
            <div class="navbar-header page-scroll">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand page-scroll" href="{{ '/index.html' | relative_url }}">Jingdi Lei</a>
            </div>

            <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="{{ '/index.html#about' | relative_url }}">About</a></li>
                    <li><a href="{{ '/index.html#news' | relative_url }}">News</a></li>
                    <li><a href="{{ '/index.html#pub' | relative_url }}">Papers</a></li>
                    <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header>
        <div class="container">
            <div class="intro-text">
                <div class="intro-heading">Blog</div>
            </div>
        </div>
    </header>

    <section class="bg-light-gray">
        <div class="container">
            <article class="post-content">
                <div class="post-meta">{{ page.date | date: "%Y.%m.%d" }}</div>
                <h2 class="section-heading">{{ page.title }}</h2>
                {{ content }}
            </article>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <span class="copyright">Jingdi Lei's Homepage 2026</span>
                </div>
                <div class="col-md-4"></div>
                <div class="col-md-4">
                    <ul class="list-inline quicklinks">
                        <li>Live for what you love.</li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="{{ '/js/jquery-1.11.0.js' | relative_url }}"></script>
    <script src="{{ '/js/bootstrap.min.js' | relative_url }}"></script>
    <script src="{{ '/js/new.js' | relative_url }}"></script>
    <script src="{{ '/js/classie.js' | relative_url }}"></script>
    <script src="{{ '/js/cbpAnimatedHeader.js' | relative_url }}"></script>
    <script src="{{ '/js/agency.js' | relative_url }}"></script>

</body>

</html>
